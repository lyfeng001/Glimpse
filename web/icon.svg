<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Glimpse">
  <!-- Glimpse mark: a winking face built from terminal glyphs: ">" and "•" as eyes, a smile as the cursor line.
       Master artwork; scratch/make_icons.js renders the PNG sizes and maskable/full-bleed variants from it. -->
  <defs>
    <linearGradient id="g-mark" x1="140" y1="160" x2="360" y2="380" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#7AA7FF"/>
      <stop offset="1" stop-color="#2EE6C5"/>
    </linearGradient>
  </defs>
  <g id="bg"><rect width="512" height="512" rx="114" fill="#0D1220"/></g>
  <g id="mark" fill="none" stroke="url(#g-mark)" stroke-width="40" stroke-linecap="round" stroke-linejoin="round">
    <path d="M146 168l66 50-66 50"/>
    <circle cx="346" cy="218" r="34" fill="url(#g-mark)" stroke="none"/>
    <path d="M190 330q66 46 132 0"/>
  </g>
</svg>
